name: 打包并上传插件

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 已发布 Release 的标签；留空时只检查和打包
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-package-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: 检查并打包
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: 获取对应版本的源码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
          persist-credentials: false

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 读取并校验版本
        id: metadata
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'))
          const tag = process.env.RELEASE_TAG
          if (tag && tag !== version && tag !== `v${version}`) {
            throw new Error(`Release 标签 ${tag} 与 package.json 版本 ${version} 不一致`)
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `archive=dist/${name}-${version}.tgz\nversion=${version}\n`)
          NODE

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 vendor 与锁文件一致
        run: |
          # vendor/ 是提交进仓库的运行时依赖（离线安装用）。CI 重新生成一次，
          # 若与提交内容不同说明有人改了依赖却忘了提交 vendor。
          node scripts/vendor-deps.mjs
          if [ -n "$(git status --porcelain vendor)" ]; then
            echo "::error::vendor/ 与 pnpm-lock.yaml 不一致，请在本地运行 pnpm run vendor 并提交结果"
            git status --porcelain vendor
            exit 1
          fi

      - name: 检查 JavaScript 语法
        run: git ls-files -z '*.js' '*.mjs' ':!:vendor/**' | xargs -0 -r -n 1 node --check

      - name: 运行测试
        run: pnpm run check

      - name: 打包并核对文件清单
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
        run: |
          pnpm pack --pack-destination dist
          # 先完整保存清单，避免 grep -q 提前退出使 tar 收到 SIGPIPE。
          tar -tzf "$ARCHIVE" > dist/package-files.txt
          cat dist/package-files.txt
          # 离线安装的前提：包里必须自带 vendor 依赖
          grep -Fxq 'package/vendor/node_modules/mqtt/package.json' dist/package-files.txt \
            || { echo "::error::安装包缺少 vendor/node_modules/mqtt"; exit 1; }
          grep -Fxq 'package/vendor/mqtt.js' dist/package-files.txt \
            || { echo "::error::安装包缺少 vendor/mqtt.js"; exit 1; }

      - name: 保存工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-awp-${{ steps.metadata.outputs.version }}
          path: ${{ steps.metadata.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

      - name: 上传到 Release 附件
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
        run: gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber

  npm:
    name: 发布到 npm
    needs: package
    if: vars.NPM_PUBLISH_ENABLED == 'true' && (github.event.release.tag_name != '' || inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PACKAGE_VERSION: ${{ needs.package.outputs.version }}
      ARCHIVE: ./dist/dsh-awp-${{ needs.package.outputs.version }}.tgz
    steps:
      - name: 下载已经检查的插件包
        uses: actions/download-artifact@v4
        with:
          name: dsh-awp-${{ needs.package.outputs.version }}
          path: dist

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 配置支持 Trusted Publishing 的 npm
        run: npm install --global npm@11.21.2 --registry=https://registry.npmjs.org/ --ignore-scripts

      - name: 核对 Release 与 npm 版本
        id: npm
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { appendFileSync, readFileSync } from 'node:fs'

          const release = JSON.parse(execFileSync('gh', [
            'release', 'view', process.env.RELEASE_TAG, '--json', 'isDraft,isPrerelease',
          ], { encoding: 'utf8' }))
          if (release.isDraft) throw new Error('草稿 Release 不发布到 npm')
          const version = process.env.PACKAGE_VERSION
          const tag = release.isPrerelease || version.includes('-') ? 'next' : 'latest'
          const response = await fetch(`https://registry.npmjs.org/dsh-awp/${encodeURIComponent(version)}`, {
            signal: AbortSignal.timeout(30_000),
          })
          let published = false
          if (response.ok) {
            const metadata = await response.json()
            const integrity = `sha512-${createHash('sha512').update(readFileSync(process.env.ARCHIVE)).digest('base64')}`
            if (metadata.name !== 'dsh-awp' || metadata.version !== version || metadata.dist?.integrity !== integrity) {
              throw new Error(`npm 已存在 dsh-awp@${version}，但内容与本次安装包不一致；请递增版本，不能覆盖`)
            }
            published = true
            console.log(`dsh-awp@${version} 已发布且内容一致，跳过重复上传`)
          } else if (response.status !== 404) {
            throw new Error(`查询 npm 版本失败：HTTP ${response.status}`)
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\npublished=${published}\n`)
          NODE

      - name: 使用 GitHub 身份发布同一个插件包
        if: steps.npm.outputs.published != 'true'
        env:
          NPM_DIST_TAG: ${{ steps.npm.outputs.tag }}
        run: npm publish "$ARCHIVE" --access public --tag "$NPM_DIST_TAG" --registry=https://registry.npmjs.org/ --ignore-scripts

      - name: 确认 npm 可查询该版本
        run: npm view "dsh-awp@$PACKAGE_VERSION" version dist.tarball --registry=https://registry.npmjs.org/
